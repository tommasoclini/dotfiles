map shift+alt+h previous_tab
map shift+alt+l next_tab

map ctrl+shift+enter new_window_with_cwd

map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map cmd+minus change_font_size all -1.0
map shift+cmd+minus change_font_size all -1.0

# macos quirks

macos_option_as_alt left

map shift+cmd+h previous_tab
map shift+cmd+l next_tab

map cmd+left send_text all \x1b[H
map cmd+right send_text all \x1b[F

map cmd+backspace send_text all \x1b[3~

# end macos quirks

font_family      family='JetBrainsMonoNL Nerd Font Mono' style=Light
bold_font        family='JetBrainsMonoNL Nerd Font Mono' style=Regular
italic_font      family='JetBrainsMonoNL Nerd Font Mono' style='Light Italic'
bold_italic_font family='JetBrainsMonoNL Nerd Font Mono' style=Italic

# font_family      family='JetBrainsMonoNL Nerd Font Mono' style=ExtraLight
# bold_font        family='JetBrainsMonoNL Nerd Font Mono' style=Regular
# italic_font      family='JetBrainsMonoNL Nerd Font Mono' style='ExtraLight Italic'
# bold_italic_font family='JetBrainsMonoNL Nerd Font Mono' style=Italic

font_size 18.0

hide_window_decorations yes
background_image_layout cscaled
background_tint 0.99

enabled_layouts grid, stack

wayland_enable_ime no

# theme
include current-theme.conf
